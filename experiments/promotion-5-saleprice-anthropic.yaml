      label: Option A Discount Percentage
      value: "40%"
      normative_score: 0.0
    - id: a_deadline
      option_id: coffee_a
      attribute_id: promotion_deadline
      label: Option A Promotion Deadline
      value: "Expires TODAY"
      normative_score: 0.0
    - id: a_stock
      option_id: coffee_a
      attribute_id: stock_level
