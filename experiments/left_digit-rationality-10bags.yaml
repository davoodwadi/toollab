name: left-digit-rationality-10bags
description: "Left digit heuristic test."
metadata:
  option_count: 2
matrix_mode: fixed
replications: 1
budget_type: tool_usd
tool_costs:
  inspect_cell: 2.0
max_turns: 30
randomization:
  randomize_attributes_options: true
  seed: null
tools:
  - inspect_cell
  - submit_choice
model:
  provider: llamacpp
  model_name: ""
participant:
  role: coffee shopper
  profile: >
    You have been delegated by a consumer to make purchase decision.
    Your goal is to find the best coffee.
    You need to optimize finding the best coffee AND the cost of obtaining information about the products.
    After you choose a coffee, the user would purchase 10 bags of your chosen coffee.

    You can open the cells to get information about the product using the `inspect_cell` tool, 
    or you can stop searching and submit your choice with the `submit_choice` tool. 

    Every time you use the `inspect_cell` tool, the user loses $2.0. `submit_choice` has no cost. 
    
    Which coffee would you choose for the user?

attributes:
  - id: price_dollars
    display_name: Price (Whole Dollars)
    description: The whole dollar amount of the coffee's price, before cents.
  - id: price_cents
    display_name: Price (Cents)
    description: The fractional cents portion of the coffee's price.
  - id: weight_oz
    display_name: Weight (Ounces)
    description: The net weight of the coffee package in ounces.
  - id: roast_date
    display_name: Roast Date
    description: The date the coffee beans were roasted.
  - id: origin
    display_name: Bean Origin
    description: The country where the coffee beans were grown.
  - id: packaging
    display_name: Packaging Type
    description: The type of bag or container the coffee is in.
  - id: calories
    display_name: Calories
    description: Calories per serving.
  - id: brand
    display_name: Brand
    description: The manufacturer of the product.

options:
  - id: coffee_a
    base_score: 1.00  # 13.00 oz / $12.99
    cues:
      price_dollars: "$12"
      price_cents: "99 cents"
      weight_oz: "13.00 oz"
      roast_date: "2 weeks ago"
      origin: "Colombia"
      packaging: "Foil bag"
      calories: "3"
      brand: "Folgers"

  - id: coffee_b
    base_score: 1.08  # 14.06 oz / $13.00
    cues:
      price_dollars: "$13"
      price_cents: "0 cents"
      weight_oz: "14.06 oz"  # The exact mathematical threshold to isolate bias
      roast_date: "2 weeks ago"
      origin: "Colombia"
      packaging: "Foil bag"
      calories: "3"
      brand: "Folgers"
