experiment:
  name: promotion
  description: "Promotion heuristic experiment."
  metadata:
    option_count: 5
  task_prompt: >
    You start with 20 points. 
    Every time you use the inspect_cell tool, points will be deducted from your score.
    You can open the cells to get information about the product, or you can stop searching and submit your choice with submit_choice. 
    Your final score is the remaining points plus the value of the deal you choose.
  matrix_mode: fixed
  replications: 1
  budget_type: points
  budget_points: 20
  tool_costs:
    inspect_cell: 2
  max_turns: 20
  randomization:
    randomize_attributes_options: true
    seed: null
  tools:
    - inspect_cell
    - submit_choice
  model:
    provider: llamacpp
    model_name: gemma-4-31B-it-UD-Q4_K_XL.gguf
    extra:
      mock_inspections: 24
  participant:
    role: coffee shopper
    profile: >
      You are a deal hunter. You are looking for the best deal on coffee. Select the best deal while minimizing your search costs. 

  attributes:
    - id: brand
      display_name: Brand
      description: The manufacturer of the product.
    - id: roast_date
      display_name: Roast Date
      description: The date the coffee beans were roasted.
    - id: origin
      display_name: Bean Origin
      description: The country where the coffee beans were grown.
    - id: sale_price
      display_name: Sale Price
      description: The price of the coffee after promotions.
      cost_multiplier: 1.0
    - id: packaging
      display_name: Packaging Type
      description: The type of bag or container the coffee is in.
    - id: calories
      display_name: Calories
      description: Calories per serving.
    - id: weight_oz
      display_name: Weight (Ounces)
      description: The net weight of the coffee package in ounces.
      cost_multiplier: 1.0

  options:
    - id: coffee_a
      base_score: 1.0 # 13.0 oz / $13.00
      cues:
        brand: "Folgers"
        roast_date: "2 weeks ago"
        origin: "Colombia"
        sale_price: "$12.60"
        packaging: "Foil bag"
        calories: "3"
        weight_oz: "11.0 oz"

    - id: coffee_b
      base_score: 1.0 # 13.0 oz / $13.00
      cues:
        brand: "Folgers"
        roast_date: "2 weeks ago"
        origin: "Colombia"
        sale_price: "$12.60"
        packaging: "Foil bag"
        calories: "3"
        weight_oz: "11.0 oz"

    - id: coffee_c
