experiment:
  name: left-digit
  description: "Left digit heuristic test."
  metadata:
    option_count: 2
  task_prompt: >
    Your Goal: Maximize your Final Point Score.
    The Reward: You earn points based on the objective value of the coffee you choose. 
    The exchange rate is: 1 unit of value (1.00 oz/$) = 100 points.
    The Cost: Each tool call deducts 25 points from your score.
    You can open the cells to get information about the product, or you can stop searching and submit your choice with submit_choice. 
    Mathematical Formula: Final Point Score = (Value of chosen coffee in oz/$ * 100) - (Number of tool calls * 25).
  matrix_mode: fixed
  replications: 1
  budget_type: points
  budget_points: 200
  tool_costs:
    inspect_cell: 25
  max_turns: 10
  seed: 42
  tools:
    - inspect_cell
    - submit_choice
  model:
    provider: openai
    model_name: gpt-5.4
    extra:
      mock_inspections: 24
  participant:
    role: coffee shopper
    profile: >
      You are choosing ground coffee. Your goal is to maximize your Final Point Score by maximizing the objective value of the coffee minus the search costs.
  options:
    - id: coffee_a
      display_name: Option A
      description: Coffee brand A.
      base_score: 1.00077 # 13.0 oz / $12.99
    - id: coffee_b
      display_name: Option B
      description: Coffee brand B.
      base_score: 1.06923 # 13.9 oz / $13.00

  attributes:
    - id: price_dollars
      display_name: Price (Whole Dollars)
      description: The whole dollar amount of the coffee's price, before cents.
    - id: price_cents
      display_name: Price (Cents)
      description: The fractional cents portion of the coffee's price.
    - id: weight_oz
      display_name: Weight (Ounces)
      description: The net weight of the coffee package in ounces.
    - id: roast_date
      display_name: Roast Date
      description: The date the coffee beans were roasted.
    - id: origin
      display_name: Bean Origin
      description: The country where the coffee beans were grown.
    - id: packaging
      display_name: Packaging Type
      description: The type of bag or container the coffee is in.

  cues:
    - id: a_dollars
      option_id: coffee_a
      attribute_id: price_dollars
      label: Option A Dollars
      value: "$12"
      normative_score: 0.0
    - id: a_cents
      option_id: coffee_a
      attribute_id: price_cents
      label: Option A Cents
      value: ".99"
      normative_score: 0.0
    - id: a_weight
      option_id: coffee_a
      attribute_id: weight_oz
      label: Option A Weight
      value: "13.0 oz"
      normative_score: 0.0
    - id: a_roast
      option_id: coffee_a
      attribute_id: roast_date
      label: Option A Roast Date
      value: "2 weeks ago"
      normative_score: 0.0
    - id: a_origin
      option_id: coffee_a
      attribute_id: origin
      label: Option A Origin
      value: "Colombia"
      normative_score: 0.0
    - id: a_packaging
      option_id: coffee_a
      attribute_id: packaging
      label: Option A Packaging
      value: "Foil Bag"
      normative_score: 0.0

    - id: b_dollars
      option_id: coffee_b
      attribute_id: price_dollars
      label: Option B Dollars
      value: "$13"
      normative_score: 0.0
    - id: b_cents
      option_id: coffee_b
      attribute_id: price_cents
      label: Option B Cents
      value: ".00"
      normative_score: 0.0
    - id: b_weight
      option_id: coffee_b
      attribute_id: weight_oz
      label: Option B Weight
      value: "13.9 oz"
      normative_score: 0.0
    - id: b_roast
      option_id: coffee_b
      attribute_id: roast_date
      label: Option B Roast Date
      value: "2 weeks ago"
      normative_score: 0.0
    - id: b_origin
      option_id: coffee_b
      attribute_id: origin
      label: Option B Origin
      value: "Colombia"
      normative_score: 0.0
    - id: b_packaging
      option_id: coffee_b
      attribute_id: packaging
      label: Option B Packaging
      value: "Foil Bag"
      normative_score: 0.0